function optionsFor(dm, cur) {
  const dd = XC[cl.code].dims[dm];
  const sel = v => v === cur ? ' selected' : '';
  let h = `<option value="">${t('e.cl.none')}</option>`;
  if (dd) h += dd.options.map(o => `<option value="${esc(o.value)}"${sel(o.value)}>${esc(o.value)} · ${esc(o.filler ? o.filler.label : o.label)}</option>`).join('');
  const other = Object.keys(LETTERS[dm]).filter(v => !(dd && dd.options.some(o => o.value === v))).sort();
  if (other.length) h += `<optgroup label="${esc(t('e.cl.others'))}">${other.map(v => `<option value="${esc(v)}"${sel(v)}>${esc(v)}</option>`).join('')}</optgroup>`;
  return h;
}
function presetName(p) {
  const bad = p.expectFlag ? ` (${t('e.cl.invalid')})` : '';
  return esc(p.name) + bad;
}
function renderClassifier(animate) {
  $('#cl-sentence').innerHTML = `<p class="sentence">${t('e.cl.s1')} <select id="cl-code" aria-label="${esc(t('e.cl.s1'))}">${XK.map(c => `<option value="${c}"${c === cl.code ? ' selected' : ''}>${c} · ${esc(XC[c].meaning || '')}</option>`).join('')}</select>
    ${t('e.cl.s2')} <select id="cl-c1" aria-label="${esc(t('e.cl.s2'))}">${optionsFor('char1', cl.c1)}</select>
    ${t('e.cl.s3')} <select id="cl-c2" aria-label="${esc(t('e.cl.s3'))}">${optionsFor('char2', cl.c2)}</select></p>`;
  $('#cl-presets').innerHTML = `<span class="muted" style="font-size:.84rem">${t('e.cl.presets')}</span>` + DM.presets.map(p => `<button type="button" class="preset" data-p="${p.id}"><code>${esc(p.code + (p.char1 || p.char2 ? ' ' + (p.char1 || '–') + (p.char2 ? '/' + p.char2 : '') : ''))}</code>${presetName(p)}</button>`).join('');
  renderResult(animate);
}
function renderResult(animate) {
  const r = classify(cl.code, cl.c1, cl.c2), res = $('#cl-res');
  let h;
  if (!r.classes.length) h = `<p><strong>${t('e.cl.nocls')}</strong></p>`;
  else {
    h = `<div><div class="label">${t('e.cl.in')}</div><div class="cls-row" style="margin-top:.4rem">${r.classes.map(c => `<span class="pop" style="display:inline-flex;gap:.45rem;align-items:center">${chipCls(':' + c.cls)}<span class="muted" style="font-size:.84rem">${esc(c.label || '')}</span></span>`).join('')}</div></div>`;
    const d = r.d, why = [];
    why.push(`<li>${t('e.why.code', { cls: esc(d.cls), code: esc(cl.code), axiom: esc(d.equivalentTo), implied: esc(d.implied.join('; ') || '–') })}</li>`);
    r.classes.filter(c => c.opt).forEach(c => why.push(`<li>${t('e.why.opt', { cls: esc(c.cls), base: esc(d.cls), n: dimN(c.kind), v: esc(c.opt.value), axiom: esc(c.opt.equivalentTo), implied: esc(c.opt.implied.join('; ') || '–') })}</li>`));
    r.flags.forEach(f => why.push(`<li class="flag">${t('e.flag', { n: dimN(f.dm), v: esc(f.v), code: esc(cl.code) })} ${f.others.length ? t('e.flag.some', { list: esc(f.others.slice(0, 8).join(', ') + (f.others.length > 8 ? ', …' : '')) }) : t('e.flag.none')} ${t('e.flag.tail')}</li>`));
    if (!cl.c1 && !cl.c2) why.push(`<li class="muted">${t('e.cl.nochar')}</li>`);
    h += `<div><div class="label">${t('e.cl.why')}</div><ul>${why.join('')}</ul></div>`;
    if (d.quantification) h += `<p class="muted" style="margin:0;font-size:.86rem">${t('e.cl.quant', { q: esc(d.quantification) })}</p>`;
    h += `<p class="muted" style="margin:0;font-size:.86rem">${t('e.cl.norating')}</p>`;
  }
  res.classList.remove('play'); res.innerHTML = h;
  if (animate) { void res.offsetWidth; res.classList.add('play'); }
}

/* plan */
const PH = 154;
const mhById = Object.fromEntries(DM.manholes.map(m => [m.id, m])), pipeById = Object.fromEntries(DM.pipes.map(p => [p.id, p]));
function obsPos(o) {
  if (o.manhole) { const m = mhById[o.manhole]; return { x: m.x + 5, y: m.y - 5, from: o.manhole }; }
  const p = pipeById[o.pipe], a = mhById[p.from], b = mhById[p.to], k = o.station / p.length;
  return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, from: p.from };
}
const obsWhere = o => o.manhole ? t('e.map.node', { mh: o.manhole, clock: o.clock }) : t('e.map.pipe', { pipe: o.pipe, m: o.station, from: pipeById[o.pipe].from, clock: o.clock });
function renderPlan() {
  const W = 230;
  let s = `<svg class="plan" viewBox="0 0 ${W} ${PH}" role="group" aria-label="${esc(t('e.map.aria', { n: DM.observations.length }))}">`;
  DM.blocks.forEach(b => { s += `<polygon class="blk" points="${b.map(p => p.join(',')).join(' ')}"/>`; });
  DM.pipes.forEach((p, i) => {
    const a = mhById[p.from], b = mhById[p.to], d = i * .3;
    s += `<path class="pipe draw" pathLength="1" d="M${a.x} ${a.y} L${b.x} ${b.y}" style="--d:${d.toFixed(2)}s"/>`;
    const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    s += `<g transform="translate(${(a.x + b.x) / 2} ${(a.y + b.y) / 2}) rotate(${ang.toFixed(1)})"><g class="pop" style="--d:${(d + .5).toFixed(2)}s"><path class="fl" d="M-2 -1.7 L2.4 0 L-2 1.7 Z"/></g></g>`;
    s += `<text x="${(a.x + b.x) / 2 + 2}" y="${(a.y + b.y) / 2 + 6}" text-anchor="middle" style="fill:var(--muted)">${p.id}</text>`;
  });
  DM.manholes.forEach((m, i) => { s += `<g class="mh pop" style="--d:${(1.4 + i * .05).toFixed(2)}s"><circle cx="${m.x}" cy="${m.y}" r="2.6"/><text x="${m.x - 3.2}" y="${m.y + 7}">${m.id}</text></g>`; });
  DM.observations.forEach((o, i) => {
    const p = obsPos(o), cat = catOf(o.code), a = o.clock * Math.PI / 6;
    const shape = o.manhole ? '<rect x="-3.1" y="-3.1" width="6.2" height="6.2" rx="1"/>' : '<circle r="3.3"/>';
    s += `<g transform="translate(${p.x.toFixed(2)} ${p.y.toFixed(2)})"><g class="mk pop" tabindex="0" role="button" aria-pressed="${planSel === o.id}" aria-label="${esc(t('e.map.markerAria', { code: o.code, where: obsWhere(o) }))}" data-o="${o.id}" style="--d:${(1.7 + i * .12).toFixed(2)}s"><g style="fill:${CATC[cat]};stroke:#fff;stroke-width:.8">${shape}</g><line x1="0" y1="0" x2="${(Math.sin(a) * 2.5).toFixed(2)}" y2="${(-Math.cos(a) * 2.5).toFixed(2)}" stroke="#fff" stroke-width="1" stroke-linecap="round"/><circle class="ring" r="5"/></g></g>`;
  });
  s += `<g transform="translate(217 17)"><path d="M0 -9 L3.5 3 L0 .8 L-3.5 3 Z" style="fill:var(--ink)"/><text y="-11" text-anchor="middle">N</text></g>`;
  s += `<g><path d="M8 146 H58 M8 144 V148 M33 144.5 V147.5 M58 144 V148" style="stroke:var(--ink);stroke-width:.6;fill:none"/><text x="8" y="142.5">0</text><text x="33" y="142.5" text-anchor="middle">25</text><text x="58" y="142.5" text-anchor="middle">50 m</text></g>`;
  s += `<text class="syn" x="224" y="150" text-anchor="end">${esc(t('e.map.syn'))}</text></svg>`;
  const cats = ['Fabric', 'Operation', 'Inventory', 'Other'];
  const legend = `<div class="legend">${cats.map(c => `<span><i class="rnd" style="background:${CATC[c]};border-color:${CATC[c]}"></i>${t('e.cat.' + c)}</span>`).join('')}<span><i class="rnd" style="border-color:var(--ink)"></i>${t('e.map.lpipe')}</span><span><i class="sq" style="border-color:var(--ink)"></i>${t('e.map.lnode')}</span></div>`;
  $('#st-plan').innerHTML = `<div class="plan-grid"><div>${s}${legend}</div><div id="plan-info"></div></div>`;
  renderPlanInfo();
}
function renderPlanInfo() {
  const o = DM.observations.find(x => x.id === planSel), el = $('#plan-info');
  if (!el) return;
  if (!o) { el.innerHTML = `<p class="muted">${t('e.map.none')}</p>`; return; }
  const r = classify(o.code, o.char1 || '', o.char2 || '');
  el.innerHTML = `<div class="big">${o.code}</div><div>${esc(XC[o.code].label || '')}</div><div class="muted" style="font-size:.86rem">${esc(obsWhere(o))}</div>
    <div class="cls-row">${r.classes.map(c => chipCls(':' + c.cls)).join('')}</div>
    <div class="muted" style="font-size:.84rem">${esc(o.name)}</div>
    <div class="presets"><button type="button" class="btn" data-open="${o.code}">${t('e.map.open')}</button><button type="button" class="btn ghost" data-open-cl="${o.id}">${t('e.map.openCl')}</button></div>`;
}
function selectObs(id) {
  planSel = id;
  $$('#st-plan .mk').forEach(m => m.setAttribute('aria-pressed', String(m.dataset.o === id)));
  renderPlanInfo();
}
function renderExplore() { renderExList(); renderExDetail(); renderClassifier(false); renderPlan(); }

$('#ex-q').addEventListener('input', e => { exQ = e.target.value; renderExList(); });
$('#ex-list').addEventListener('click', e => { const b = e.target.closest('[data-code]'); if (b) selectCode(b.dataset.code, true); });
$('#ex-detail').addEventListener('click', e => {
  const b = e.target.closest('[data-classify]'); if (!b) return;
  cl = { code: b.dataset.classify, c1: '', c2: '' }; renderClassifier(true); $('#ex-cl').scrollIntoView();
});
$('#cl-sentence').addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'cl-code') cl = { code: e.target.value, c1: '', c2: '' }; else if (id === 'cl-c1') cl.c1 = e.target.value; else if (id === 'cl-c2') cl.c2 = e.target.value; else return;
  renderClassifier(true); const n = document.getElementById(id); if (n) n.focus();
});
$('#cl-presets').addEventListener('click', e => {
  const b = e.target.closest('[data-p]'); if (!b) return;
  const p = DM.presets.find(x => x.id === b.dataset.p);
  cl = { code: p.code, c1: p.char1 || '', c2: p.char2 || '' }; renderClassifier(true);
});
$('#st-plan').addEventListener('click', e => {
  const m = e.target.closest('.mk'); if (m) return selectObs(m.dataset.o);
  const b = e.target.closest('[data-open]');
  if (b) { history.replaceState(null, '', '#explore/' + b.dataset.open); route(); return; }
  const c = e.target.closest('[data-open-cl]');
  if (c) { const o = DM.observations.find(x => x.id === c.dataset.openCl); cl = { code: o.code, c1: o.char1 || '', c2: o.char2 || '' }; renderClassifier(true); $('#ex-cl').scrollIntoView(); }
});
$('#st-plan').addEventListener('keydown', e => {
  const m = e.target.closest && e.target.closest('.mk');
  if (m && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selectObs(m.dataset.o); }
});

/* ---------- static text, language, tabs ---------- */
function applyStatic() {
  $$('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  $$('[data-i-html]').forEach(el => { el.innerHTML = t(el.dataset.iHtml); });
  $$('[data-i-ph]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.iPh)); if (el.tagName === 'INPUT') el.placeholder = t(el.dataset.iPh); });
  document.documentElement.lang = lang;
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}
function renderAll() {
  applyStatic();
  renderOverviewStats(); renderPipeline(); renderWhy(); renderLinked(false); renderContrast(); renderBenefits();
  renderXml2Rdf(); renderGraph(); renderM150Stats();
  renderLift(); renderReason(); renderHits(); renderQueries(); typeQuery(); renderTree(); renderFacts();
  renderExplore();
}
function setLang(l) {
  lang = l; try { localStorage.setItem('sdco-lang', l); } catch (e) {}
  renderAll(); $$('[data-scene]').forEach(a => $('.stage', a) && $('.stage', a).classList.remove('play')); observeVisible();
}
const TABS = ['overview', 'm150', 'sdco', 'benefits', 'explore'];
function showTab(name, push) {
  if (!TABS.includes(name)) name = 'overview';
  TABS.forEach(n => { $('#panel-' + n).hidden = n !== name; });
  $$('.tab-btn').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  const hash = '#' + name + (name === 'explore' ? '/' + exCode : '');
  if (push && location.hash !== hash) history.replaceState(null, '', hash);
  window.scrollTo(0, 0);
  $$('.panel:not([hidden]) [data-scene]').forEach(a => { const s = $('.stage', a); s && s.classList.remove('play'); });
  observeVisible();
}
$$('.tab-btn').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab, true)));
$$('[data-goto]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.goto, true)));
$$('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
function syncLg() { $$('[data-lgmode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lgmode === lgMode))); $('#lg-det').setAttribute('aria-pressed', String(lgDet)); $('#lg-hd').setAttribute('aria-pressed', String(lgHd)); }
$$('[data-lgmode]').forEach(b => b.addEventListener('click', () => { if (lgMode === b.dataset.lgmode) return; lgMode = b.dataset.lgmode; syncLg(); lgView && lgView(lgMode); }));
$('#lg-det').addEventListener('click', () => { lgDet = !lgDet; syncLg(); lgView && lgView('det'); });
$('#lg-hd').addEventListener('click', () => { lgHd = !lgHd; syncLg(); lgView && lgView('hd'); });
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-goto-scene]'); if (!b) return;
  showTab(b.dataset.gotoTab, true);
  requestAnimationFrame(() => { const a = $(`[data-scene="${b.dataset.gotoScene}"]`); if (a) a.scrollIntoView(); });
});
$$('.replay').forEach(b => b.addEventListener('click', () => playScene(b.closest('[data-scene]').dataset.scene)));
// #tab or #explore/CODE
function route() {
  const [tab, raw] = location.hash.slice(1).split('/');
  showTab(tab, false);
  const code = raw && decodeURIComponent(raw);
  if (tab === 'explore' && code && XC[code]) selectCode(code, false);
}
window.addEventListener('hashchange', route);

renderAll();
route();
})();
</script>
</body>
