<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m150-onto and SDCO explained</title>
<style>
/* Light theme only: the animations are meant to be screen-captured for slides.
   Layout, components and animation vocabulary (draw / pop / rise / typing / count-up / replay)
   follow the sib2asb-onto site template, re-coloured for white. */
:root {
  --paper: #ffffff;
  --surface: #f6f8fa;
  --ink: #14202b;
  --muted: #566370;
  --line: #d8dee4;
  --accent: #b0650c;    /* ochre: literals, highlights */
  --link: #1c6a73;      /* teal: IRIs, classes, edges */
  --code: #f1f4f7;
  --ok: #2f7d50; --warn: #c2462c;
  --shadow: 0 1px 0 rgba(20,32,43,.05), 0 10px 26px -16px rgba(20,32,43,.25);
  --f-display: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, "Book Antiqua", Georgia, serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --wrap: 70rem;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.6 var(--f-body); -webkit-font-smoothing: antialiased; padding-inline: max(16px, env(safe-area-inset-left)); overflow-x: hidden; }
.wrap { max-width: var(--wrap); margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: clamp(2.2rem, 5.6vw, 4rem); line-height: 1.06; font-weight: 700; max-width: 19ch; letter-spacing: -.02em; }
h2 { font-size: 1.5rem; line-height: 1.2; font-weight: 750; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--link); }
code, .mono { font-family: var(--f-mono); font-size: .86em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.label { font-size: .82rem; color: var(--muted); font-weight: 650; }
.lead { font-size: 1.12rem; max-width: 44rem; }
.muted { color: var(--muted); }

/* ---------------- top bar: tabs + language ---------------- */
.top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left))); padding-inline: max(16px, env(safe-area-inset-left)); }
.top .wrap { display: flex; align-items: center; gap: 1rem; padding-block: .55rem; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; margin-right: .5rem; }
.brand span { color: var(--accent); }
.tabs { display: flex; gap: .25rem; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
.tab-btn { font: inherit; font-weight: 650; font-size: .92rem; border: 0; background: none; color: var(--muted); cursor: pointer; padding: .45rem .85rem; border-radius: 999px; white-space: nowrap; transition: background .2s, color .2s; }
.tab-btn:hover { color: var(--ink); background: var(--surface); }
.tab-btn[aria-selected="true"] { background: var(--ink); color: #fff; }
.lang { display: flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; margin-left: auto; }
.lang button { font: inherit; font-weight: 700; font-size: .8rem; border: 0; background: none; color: var(--ink); padding: .28rem .7rem; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }

/* ---------------- layout ---------------- */
.panel[hidden] { display: none; }
.hero { padding-block: clamp(2rem, 6vw, 4rem) 1.5rem; display: grid; gap: 1.3rem; }
.section-head { margin: 3rem 0 1rem; display: grid; gap: .4rem; }
.scene { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); margin-block: 1.6rem; overflow: hidden; }
.scene > header { display: flex; align-items: center; gap: .8rem; padding: .9rem 1.2rem; border-bottom: 1px solid var(--line); background: var(--surface); }
.scene > header h2 { font-size: 1.15rem; flex: 1 1 auto; }
.scene > header .num { font: 700 .75rem var(--f-mono); color: #fff; background: var(--accent); border-radius: 4px; padding: .12rem .4rem; }
.scene > .intro { padding: 1rem 1.2rem 0; max-width: 52rem; color: var(--ink); }
.scene > .note { padding: 0 1.2rem 1.1rem; max-width: 52rem; font-size: .9rem; color: var(--muted); }
.stage { padding: 1.2rem; min-height: 15rem; min-width: 0; }
.btn { font: inherit; font-weight: 650; font-size: .82rem; border: 1.5px solid var(--ink); background: var(--ink); color: #fff; padding: .32rem .85rem; border-radius: 999px; cursor: pointer; transition: transform .2s; }
.btn:hover { transform: translateY(-1px); }
.btn.ghost { background: none; color: var(--ink); }
.callout { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; border: 1px dashed var(--line); border-radius: 10px; padding: .9rem 1.1rem; margin-block: 1.4rem; background: var(--surface); }
.callout p { flex: 1 1 22rem; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid var(--ink); margin-top: .5rem; }
.stat { padding: .9rem 1rem .9rem 0; border-right: 1px solid var(--line); }
.stat + .stat { padding-left: 1rem; }
.stat:last-child { border-right: 0; }
.stat b { display: block; font-size: 2.1rem; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--muted); line-height: 1.35; display: block; margin-top: .3rem; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat:nth-child(2) { border-right: 0; } .stat:nth-child(3) { padding-left: 0; } .stat:nth-child(n+3) { border-top: 1px solid var(--line); } }

/* ---------------- shared pieces ---------------- */
.chip { display: inline-block; font-family: var(--f-mono); font-size: .8rem; font-weight: 600; padding: .12rem .5rem; border-radius: 5px; border: 1.5px solid; white-space: nowrap; }
.chip.lit { color: var(--accent); border-color: var(--accent); background: #fdf6ec; }
.chip.cls { color: var(--link); border-color: var(--link); background: #edf6f7; }
.chip.cls.big { font-size: .95rem; padding: .3rem .75rem; }
.chip.lit.big { font-size: 1.3rem; padding: .35rem 1rem; }
pre.code { margin: 0; padding: .9rem 1rem; background: var(--code); border-radius: 6px; font: .76rem/1.6 var(--f-mono); overflow-x: auto; tab-size: 2; }
pre.code .kw { color: var(--link); font-weight: 650; } pre.code .pf { color: var(--accent); } pre.code .var { color: var(--ok); } pre.code .str { color: var(--warn); } pre.code .cm { color: var(--muted); font-style: italic; }
pre.code .ln { display: block; }
.chips { display: inline-flex; flex-wrap: wrap; gap: .3rem; }
.xmlline { font-family: var(--f-mono); font-size: .8rem; white-space: pre; }
.xmlline .tg { color: var(--link); } .xmlline .val { color: var(--ink); font-weight: 600; }
.arrow { color: var(--accent); font-family: var(--f-mono); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table.res { border-collapse: collapse; width: 100%; font-size: .82rem; font-variant-numeric: tabular-nums; }
table.res th { text-align: left; font-size: .76rem; color: var(--muted); padding: .5rem .7rem; border-bottom: 1.5px solid var(--ink); background: var(--surface); white-space: nowrap; }
table.res td { padding: .45rem .7rem; border-bottom: 1px solid var(--line); font-family: var(--f-mono); font-size: .78rem; }
table.res tr:last-child td { border-bottom: 0; }
.legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin-top: .8rem; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: .35rem; border: 1.5px solid; }

/* ---------------- overview pipeline ---------------- */
.pipe { display: grid; grid-template-columns: minmax(0,1fr) 7rem minmax(0,1fr) 7rem minmax(0,1fr); align-items: stretch; gap: 0; }
.box { border: 1.5px solid var(--ink); border-radius: 10px; padding: 1rem; display: grid; gap: .35rem; align-content: start; background: var(--paper); }
.box .big { font-size: 2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.box small { color: var(--muted); font-size: .8rem; line-height: 1.35; }
.box.b1 { border-color: var(--muted); } .box.b2 { border-color: var(--accent); } .box.b3 { border-color: var(--link); }
.conn { position: relative; display: grid; place-items: center; font-size: .72rem; color: var(--muted); text-align: center; padding-inline: .3rem; }
.conn i { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--ink); transform-origin: left; }
.conn i::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left: 8px solid var(--ink); }
.conn span { position: relative; background: var(--paper); padding: 0 .25rem; margin-top: -2.2rem; }
.conn b { position: absolute; left: 0; top: calc(50% - 4px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0; }
@media (max-width: 800px) { .pipe { grid-template-columns: minmax(0,1fr); } .conn { height: 4rem; } .conn i { left: 50%; right: auto; top: 0; bottom: 0; width: 2px; height: auto; transform-origin: top; } .conn i::after { right: auto; left: -4px; top: auto; bottom: -1px; border: 5px solid transparent; border-top: 8px solid var(--ink); border-left-color: transparent; } .conn span { margin-top: 0; } .conn b { display: none; } }

.contrasts { display: grid; border-top: 2px solid var(--ink); }
.contrast { display: grid; grid-template-columns: minmax(0,1fr) 2rem minmax(0,1fr); gap: 1rem; padding: .85rem 0; border-bottom: 1px solid var(--line); font-size: .92rem; line-height: 1.5; }
.contrast .l { color: var(--muted); } .contrast .arrow { text-align: center; }
.contrast.head { font-weight: 700; font-size: .85rem; padding: .55rem 0; }
@media (max-width: 640px) { .contrast { grid-template-columns: minmax(0,1fr); gap: .3rem; } .contrast .arrow { text-align: left; } .contrast.head { display: none; } .contrast .l::before { content: attr(data-lbl) ": "; font-weight: 700; } .contrast .r::before { content: attr(data-lbl) ": "; font-weight: 700; color: var(--accent); } }

/* ---------------- m150: xml to triples ---------------- */
.x2t { display: grid; gap: .45rem; }
.x2t .row { display: grid; grid-template-columns: minmax(0,.8fr) 3.2rem minmax(0,1.5fr); align-items: center; gap: .5rem; padding: .3rem .6rem; border-radius: 6px; }
.x2t .row:nth-child(odd) { background: var(--surface); }
.x2t .ar { height: 2px; background: var(--accent); position: relative; transform-origin: left; }
.x2t .ar::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left: 8px solid var(--accent); }
.x2t .hd { font-size: .78rem; color: var(--muted); font-weight: 650; padding: 0 .6rem; }
.trip { font-family: var(--f-mono); font-size: .78rem; overflow-wrap: anywhere; }
.trip .s { color: var(--muted); } .trip .p { color: var(--link); font-weight: 600; } .trip .o.lit { color: var(--accent); font-weight: 600; } .trip .o.iri { color: var(--link); } .trip .dt { color: var(--muted); font-size: .85em; }
.trip.added { opacity: .9; } .tag-added { font: 600 .65rem var(--f-body); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 .3rem; margin-left: .4rem; }
@media (max-width: 700px) { .x2t .row { grid-template-columns: minmax(0,1fr); gap: .15rem; } .x2t .ar { width: 2.2rem; height: 14px; background: none; } .x2t .ar::before { content: "↓"; color: var(--accent); font-family: var(--f-mono); } .x2t .ar::after { display: none; } .x2t .hd.r { display: none; } }
svg.graph { width: 100%; height: auto; display: block; overflow: visible; }
svg.graph .e { stroke: var(--link); stroke-width: 1.4; fill: none; stroke-dasharray: 1; }
svg.graph .el { font: 10px var(--f-mono); fill: var(--muted); paint-order: stroke; stroke: #fff; stroke-width: 4px; text-anchor: middle; }
svg.graph .n rect { stroke-width: 1.5; }
svg.graph .n text { font: 600 11px var(--f-mono); text-anchor: middle; dominant-baseline: central; }
svg.graph .n.lit rect { fill: #fdf6ec; stroke: var(--accent); } svg.graph .n.lit text { fill: var(--accent); }
svg.graph .n.iri rect { fill: #edf6f7; stroke: var(--link); } svg.graph .n.iri text { fill: var(--link); }
svg.graph .n.ctr rect { fill: var(--ink); stroke: var(--ink); } svg.graph .n.ctr text { fill: #fff; font-size: 12px; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .8rem; }
.statgrid .box .big { font-size: 1.8rem; }

/* ---------------- sdco: taxonomy chain, reasoner ---------------- */
.lift { display: grid; gap: 1.4rem; }
.liftrow { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; }
.chainrow { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem .2rem; }
.chainrow .lnk { display: flex; align-items: center; gap: .15rem; font-size: .68rem; color: var(--muted); font-family: var(--f-mono); margin-inline: .2rem; }
.chainrow .lnk i { display: block; width: 1.6rem; height: 2px; background: var(--ink); position: relative; transform-origin: left; }
.chainrow .lnk i::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left: 7px solid var(--ink); }
.axioms { display: grid; gap: .5rem; }
.reason { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: .9rem; align-items: start; }
@media (max-width: 900px) { .reason { grid-template-columns: minmax(0,1fr); } }
.rcol { border: 1px solid var(--line); border-radius: 10px; padding: .8rem; display: grid; gap: .6rem; align-content: start; background: var(--paper); min-width: 0; }
.rcol h3 { font-size: .85rem; display: flex; gap: .45rem; align-items: center; }
.rcol h3 b { background: var(--ink); color: #fff; border-radius: 50%; width: 1.4rem; height: 1.4rem; display: grid; place-items: center; font-size: .75rem; }
.rcol .it { display: grid; gap: .25rem; font-size: .76rem; min-width: 0; }
.rcol .it code { overflow-wrap: anywhere; }
.rcol .why { color: var(--muted); font-size: .72rem; line-height: 1.35; }
.hits { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 1.2rem; }
@media (max-width: 800px) { .hits { grid-template-columns: minmax(0,1fr); } }
.hcol { border: 1px solid var(--line); border-radius: 10px; padding: 1rem; display: grid; gap: .6rem; align-content: start; min-width: 0; }
.hcol.ont { border-color: var(--link); } .hcol.xml { border-color: var(--muted); }
.bigcount { font-size: 2.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { display: grid; grid-template-columns: 11.5rem minmax(0,1fr) 2rem; align-items: center; gap: .5rem; font: .75rem var(--f-mono); }
.bar .tr { height: 12px; background: var(--code); border-radius: 3px; overflow: hidden; }
.bar .fl { height: 100%; transform-origin: left; border-radius: 3px; }
.xml .bar .fl { background: var(--accent); } .ont .bar .fl { background: var(--link); }
@media (max-width: 520px) { .bar { grid-template-columns: 8.5rem minmax(0,1fr) 1.6rem; } }

.qa { display: grid; grid-template-columns: 15rem minmax(0,1fr); }
@media (max-width: 900px) { .qa { grid-template-columns: minmax(0,1fr); } }
.qlist { display: grid; align-content: start; border-right: 1px solid var(--line); }
@media (max-width: 900px) { .qlist { border-right: 0; border-bottom: 1px solid var(--line); grid-auto-flow: column; grid-auto-columns: minmax(12rem, 1fr); overflow-x: auto; } }
.qbtn { border: 0; background: none; text-align: left; color: var(--ink); cursor: pointer; padding: .75rem .9rem; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1.9rem minmax(0,1fr); gap: .4rem; font: inherit; font-size: .84rem; line-height: 1.4; position: relative; }
.qbtn b { font: 600 .74rem var(--f-mono); color: var(--muted); }
.qbtn:hover { background: var(--surface); }
.qbtn[aria-selected="true"] { background: var(--surface); } .qbtn[aria-selected="true"] b { color: var(--accent); }
.qbtn[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
.qbody { padding: 1.2rem; display: grid; gap: 1rem; min-width: 0; align-content: start; }
.ask { font-size: 1.3rem; font-weight: 700; line-height: 1.25; }
.step { display: grid; grid-template-columns: 5rem minmax(0,1fr); gap: .8rem; align-items: start; }
@media (max-width: 640px) { .step { grid-template-columns: minmax(0,1fr); gap: .3rem; } }
.step > .label { padding-top: .3rem; }
.wo { border-left: 3px solid var(--muted); padding: .2rem 0 .2rem .9rem; display: grid; gap: .6rem; font-size: .88rem; color: var(--muted); }
details.tree { border-top: 1px solid var(--line); }
details.tree summary { cursor: pointer; padding: .3rem 0; font-size: .85rem; list-style-position: outside; }
details.tree details { margin-left: 1.2rem; }
.tcnt { font: .72rem var(--f-mono); color: var(--muted); margin-left: .4rem; }
.tleaf { margin-left: 2.2rem; padding: .25rem 0; font-size: .85rem; border-top: 1px solid var(--line); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
.facts .box small { font-size: .88rem; color: var(--ink); }
footer { border-top: 2px solid var(--ink); padding-block: 1.8rem 3rem; margin-top: 3rem; font-size: .85rem; color: var(--muted); display: grid; gap: .4rem; }

/* ---------------- overview: linked-data graph (draggable) ---------------- */
.lgwrap { display: block; padding: 0; }
.lgwrap > div { padding: 1.2rem; min-width: 0; }
.lgwrap > div + div { border-top: 1px solid var(--line); }
.lgscroll { overflow-x: auto; }
.lgpanel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 1rem 1.6rem; }
@media (max-width: 760px) { .lgpanel { grid-template-columns: minmax(0, 1fr); } svg.lg { min-width: 720px; } }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.seg button { font: inherit; font-weight: 650; font-size: .8rem; border: 0; background: none; color: var(--ink); padding: .3rem .8rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.scene > header { flex-wrap: wrap; }
#st-linked .sd, #st-linked .dt, #st-linked .hd { transition: opacity .3s, visibility 0s, stroke .2s; }
#st-linked.m-only .sd, #st-linked:not(.det-on) .dt, #st-linked:not(.hd-on) .hd { opacity: 0 !important; visibility: hidden; pointer-events: none; transition: opacity .3s, visibility 0s .3s; }
@media (prefers-reduced-motion: reduce) { #st-linked .sd, #st-linked .dt, #st-linked .hd { transition: none !important; } }
svg.lg {  width: 100%; height: auto; display: block; background: var(--surface); border-radius: 8px; user-select: none; -webkit-user-select: none; }
svg.lg .bnd { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
svg.lg .bt { font: 700 12.5px var(--f-mono); fill: var(--muted); letter-spacing: .04em; }
svg.lg .e { stroke: #8795a1; stroke-width: 1.6; fill: none; transition: stroke .2s, opacity .2s; }
svg.lg .e.x { stroke: var(--ink); stroke-width: 2; }
svg.lg .e.hl { stroke: var(--accent); stroke-width: 2.6; }
svg.lg .el { font: 600 11px var(--f-mono); fill: var(--accent); text-anchor: middle; opacity: 0; pointer-events: none; paint-order: stroke; stroke: #fff; stroke-width: 4px; transition: opacity .2s; }
svg.lg .el.hl { opacity: 1; }
svg.lg .n { cursor: grab; transition: opacity .2s; touch-action: none; }
svg.lg .n:active { cursor: grabbing; }
svg.lg .n .sh { stroke-width: 2; }
svg.lg .n.m150 .sh { fill: #fdf6ec; stroke: var(--accent); } svg.lg .n.m150 text { fill: #7a4508; }
svg.lg .n.sdco .sh { fill: #edf6f7; stroke: var(--link); } svg.lg .n.sdco text { fill: #14515a; }
svg.lg .n.literal .sh { stroke-dasharray: 3 2; }
svg.lg .n text { font: 600 12.5px var(--f-mono); text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px; }
svg.lg .n.dim { opacity: .22; } svg.lg .e.dim { opacity: .12; }
svg.lg .n.sel .sh { stroke-width: 3.6; } svg.lg .n.pin .sh { stroke: var(--ink); }
svg.lg .n:focus-visible .sh { stroke: var(--ink); stroke-width: 3.6; }
.lgtools { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; margin-top: .7rem; }
.lgtools .legend { margin: 0; }
.legend i.lit { border-style: dashed; } .legend i.rnd { border-radius: 50%; } .legend i.line { width: 18px; height: 0; border-width: 0 0 2px; border-color: var(--ink); border-radius: 0; vertical-align: 3px; }
.lgsel { font-family: var(--f-mono); font-size: .95rem; font-weight: 700; overflow-wrap: anywhere; margin-block: .2rem; }
.lgiri { font: .72rem var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
ul.lgtr { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: .3rem; max-height: 14rem; overflow-y: auto; }
ul.lgtr li { font: .74rem/1.4 var(--f-mono); overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: 6px; padding: .3rem .5rem; cursor: pointer; }
ul.lgtr li:hover, ul.lgtr li:focus-visible { background: var(--surface); }

/* ---------------- animation (only when motion is allowed; default state = fully visible) ---------------- */
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes travel { 0% { left: 0; opacity: 1; } 100% { left: calc(100% - 8px); opacity: 1; } }
@keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(176,101,12,0); } 50% { box-shadow: 0 0 0 5px rgba(176,101,12,.25); } }
.draw { stroke-dasharray: 1; }
@media (prefers-reduced-motion: no-preference) {

  .play .draw { animation: draw .8s cubic-bezier(.6,0,.2,1) both; animation-delay: var(--d, 0s); }
  .play .grow { animation: grow .6s cubic-bezier(.6,0,.2,1) both; animation-delay: var(--d, 0s); }
  .play .growx { animation: grow .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); }
  .play .conn b { animation: travel 1.1s ease-in-out both; animation-delay: var(--d, 0s); }
  .play .growy { animation: growy .6s cubic-bezier(.6,0,.2,1) both; animation-delay: var(--d, 0s); }
  .play .glow { animation: glow 1.2s ease-in-out 2; animation-delay: var(--d, 0s); }
  .play pre.code.typing .ln { animation: rise .35s ease-out both; animation-delay: var(--d, 0s); }
  .play table.res tbody tr { animation: rise .4s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); }
}

"b.kicker": "Benefits compared with the XML standard",
"b.h1": "What the ontologies add to the XML exchange format.",
"b.lead": "Six concrete differences, each shown as XML today next to the same thing with the ontologies. m150-onto and SDCO are results of the KaSyTwin project. The tag on each card says whether it is shown with real data on this page or is only a possibility.",

"b.full": "Full scene",
"b.1.title": "Queryability",
"b.1.intro": "“Show me every fissure.” In XML this needs XPath plus a list of codes that someone maintains. With the ontologies it is one subclass pattern, and codes added to the taxonomy later are included automatically.",
"b.1.note": "Same question and numbers as the SDCO scene “All fissures”, here in compact form. The SPARQL side was executed by the build; the XPath is generated from the same code list and was not run.",
"b.1.xml": "XPath, plus a list of codes someone must keep complete. In this sample the hits come from {n} codes; a pipe and a manhole code even live in different elements (<code>HZ</code> versus <code>KZ</code>).",
"b.1.ont": "One pattern. {hits} hits in the sample; SDCO defines {sub} subclasses of <code>Fissure</code>, and a subclass added later is covered without touching the query.",
"b.2.title": "Reasoning and classification",
"b.2.intro": "In XML a code is a string. With SDCO the same string makes the report a member of a chain of classes, and a reasoner works out which ones.",
"b.2.note": "The featured report <code>{report}</code>; classes as re-derived by the build (scene “The reasoner classifies the report” on the SDCO tab).",
"b.2.xml": "Three strings. Nothing in the file says that this is a fissure, or that it runs lengthwise.",
"b.2.ont": "{n} classes are inferred for this one report, and its characteristics climb the taxonomy:",
"b.3.title": "New facts by inference",
"b.3.intro": "Materialization writes the inferred facts down as ordinary triples. They exist in the data, can be queried and exported, and nobody typed them.",
"b.3.note": "Counts from the materialized file; the example triple belongs to the featured report <code>{report}</code>.",
"b.3.xml": "{n} elements were typed for this report. That is all the file contains.",
"b.3.ont": "{typed} values were asserted for the report; the build derived {for} more triples for it, for example:",
"b.3.total": "triples nobody typed, across {subjects} reports",
"b.4.title": "Consistency checking",
"b.4.intro": "DIN EN 13508-2 makes the allowed characterisation letters depend on the main code. A schema checks each field on its own; the dependency between two fields is a separate rule.",
"b.4.note": "The check runs in the build: after classification, every report whose code class has characterisation subclasses must fall into one of them (SPARQL over the classified graph, {codes} codes, {dims} code and dimension combinations). SDCO does not encode which characterisations are mandatory, so a missing letter is never flagged; only a letter that matches no subclass is. A schema listing such rules would have to restate them per code; XSD 1.1 <code>xs:assert</code> could express some. The schema named in the example file (<code>{xsd}</code>) is not in this repository, so what it enforces was not checked.",
"b.4.unv": "Unverified and left out of the check: {list} (the letters skip one, so the subclass set may be incomplete).",

"b.6.intro": "With the ontologies the meaning travels with the data instead of living inside one product.",
"b.6.note": "The versioned IRI and the import are read from <code>SDCO.rdf</code>. That any other vendor's tool reads them is not shown here.",

"ov.why.title": "Why not just better XML software?",
"ov.why.intro": "A fair objection: whoever sits in the inspection vehicle cannot read <code>&lt;{xmlCodeTag}&gt;{code}&lt;/{xmlCodeTag}&gt;</code>, but software that reads the XML can show readable names. That is true. Look at where the viewer gets its knowledge, though: it knows that <code>{code}</code> means “{meaning}” only because a developer typed the DIN EN 13508-2 and DWA-M 150 tables into it.",
"ov.why.today": "Today: every tool carries its own copy of the code table",
"ov.why.shared": "With the ontologies: every tool points to one shared layer",
"ov.why.tool": "Tool {x}",
"ov.why.miss": "missing",
"ov.why.stale": "outdated",
"ov.why.layer": "SDCO + m150-onto",
"ov.why.layers": "open, versioned, machine-readable (SDCO {version})",
"ov.why.a.t": "Where the meaning lives today",
"ov.why.a.b": "Hidden in each vendor's code, copied into every tool with its own errors, and tied to that software: when the standard changes or the tool is retired, the knowledge goes with it.",
"ov.why.b.t": "What the ontologies change",
"ov.why.b.b": "They take that knowledge out of the software and publish it once, as open, versioned, machine-readable data that any tool can use, proprietary ones included. The ontology is the layer underneath software, not a competitor to it.",
"ov.why.c.t": "Who benefits, honestly",
"ov.why.c.b": "The inspector in the vehicle sees little direct difference. The main beneficiaries are network operators, asset managers, planners and tool developers. Inspectors benefit indirectly, through better input validation and more consistent classification. That improvement in the workflow is a potential; it has not been measured.",
"ov.why.note": "Schematic. The codes and meanings are real (read from SDCO); the tools are placeholders, and the deviations between the copies illustrate the risk, they are not findings about any product.",
"ov.kicker": "Sewer inspection data, made explicit",
"ov.h1": "From coded strings to data that means something.",

"ov.cmp.title": "Exchange today versus the ontology way",
"ov.cmp.intro": "What changes in the data itself when the same inspection records are an ontology instead of an XML file. Querying, reasoning, validation and integration are on the Benefits tab.",
"ov.cmp.l": "DWA-M 150 XML (today)", "ov.cmp.r": "m150-onto + SDCO",
"cmp.1.l": "The code is a string: <code>HZ002 = BAB</code>. What it means is written in the standard (a PDF).",
"cmp.1.r": "The code is a class <code>:BAB</code> with a label and axioms. The meaning is machine-readable.",
"cmp.2.l": "Characterisation letters (<code>HZ014</code>, <code>HZ015</code>) change meaning with the code.",
"cmp.2.r": "Each combination is a class, e.g. <code>BAB1_B</code> ⊑ <code>CrackFissure</code>, <code>BAB2_A</code> ⊑ <code>Longitudinal</code>.",
"cmp.3.l": "A schema describes the structure of the file; what a value means is not part of it.",
"cmp.3.r": "Structure and meaning live in the same, queryable model.",
"ov.next": "Open one of the tabs to see each step as an animation, or go to the Benefits tab for the comparison with XML.",
"m.h1": "The DWA-M 150 format, as linked data.",
"m.lead": "m150-onto is an OWL ontology of the DWA-M 150 exchange format: pipe sections, manholes, inspections and condition reports become individuals with typed relations. The <code>ontoparser</code> converts XML files into such RDF data.",
"m.x2t.title": "One condition report: XML element by XML element into triples",
"m.x2t.intro": "On the left is the real XML block of one condition report (<code>{xmlPath}</code>, pipe {asset}), on the right the RDF triples the parser produced for it. The arrows follow the project's DWA-to-ontology mapping table.",
"m.x2t.note": "Source: <code>{xmlName}</code> and <code>m150-onto-parsed-dwa.rdf</code>. Empty XML elements are left out. The three rows tagged “parser” have no XML counterpart as such: the type, a generated label, and the link to the inspection that results from the nesting.",
"m.x2t.xml": "DWA-M 150 XML", "m.x2t.rdf": "m150-onto RDF", "m.x2t.parser": "parser",
"m.graph.title": "The same record as a graph",
"m.graph.intro": "RDF is a graph. The report becomes a node; every value becomes a labelled edge. Literals are ochre, links to other individuals are teal.",
"m.graph.note": "Note that <code>BAB</code> is still only a literal value here: m150-onto stores the code but does not say what it means. That is what SDCO adds.",
"m.graph.lit": "literal value", "m.graph.iri": "link to another individual",
"m.stats.title": "What m150-onto defines",
"m.stats.intro": "The ontology file defines the vocabulary; the parsed file holds the example data.",
"m.stats.note": "Reference tables of the standard (materials, shapes, …) are modelled as named individuals, not as classes, so that a reasoner cannot conclude that a pipe section is a material (design decision in the m150-onto README).",
"m.st.classes": "classes", "m.st.obj": "object properties", "m.st.data": "data properties", "m.st.ind": "named individuals (reference tables etc.)", "m.st.map": "DWA element codes mapped to ontology properties", "m.st.parsed": "individuals in the parsed example data",
"m.next": "The code is still just a string. Continue with SDCO to see how it gets its meaning.",
"s.h1": "Give the codes a meaning a machine can use.",
"s.lead": "SDCO (Sewer Damage Classification Ontology) formalises <strong>DIN EN 13508-2</strong>, the European coding system for the visual inspection of drains and sewers. Damage codes become OWL <strong>classes</strong>; SDCO imports m150-onto, so it works directly on the condition reports shown in the previous tab.",
"s.lift.title": "A literal code lifts into the class taxonomy",
"s.lift.intro": "The string <code>{code}</code> from the report is matched by an <code>equivalentClass</code> axiom to the class <code>:{code}</code>. Its <code>subClassOf</code> restrictions then place it in the taxonomy.",
"s.lift.note": "Axioms and class chains are read from <code>SDCO.rdf</code>. A class chain reads from the specific class upwards: each arrow means “is a subclass of”.",
"s.lift.axioms": "Axioms of the class", "s.lift.equiv": "equivalent to (matches the literal)", "s.lift.sub": "subclass of (restriction)", "s.lift.chains": "Position in the taxonomy of the two characteristics found for this report",
"s.reason.title": "The reasoner classifies the report",
"s.reason.intro": "Starting from the three literals of the report, the class definitions fire one after another. Finally the existential restrictions are turned into plain, queryable triples.",
"s.reason.note": "The fast default path forward-chains the <code>equivalentClass</code> patterns (plain value or one extra value on a code class) with SPARQL UPDATE; HermiT via <code>--reason</code> is kept as a correctness oracle. The materialization result below was re-derived by this build and equals the entry in the materialized file.",
"s.r.1": "Asserted in m150-onto", "s.r.2": "Classes the report falls into", "s.r.3": "What those classes imply", "s.r.4": "Materialized triples",
"s.r.2why": "A class matches when the report has the literal(s) in its <code>equivalentClass</code> definition.",
"s.r.3why": "<code>someValuesFrom</code> is existential: it says “has some Fissure”, but does not name a value.",
"s.r.4why": "A SPARQL CONSTRUCT keeps only the most specific class per property and writes it as a triple.",
"s.hits.title": "“All fissures”: one query instead of a list of codes",
"s.hits.intro": "The same question asked twice. Without the ontology a query has to enumerate every code and characterisation combination that stands for a fissure. With SDCO it asks for everything below <code>Fissure</code>.",
"s.hits.note": "Hits in the example dataset ({reports} reports). The left list is the set of (code, characterisation 1, characterisation 2) combinations that actually occur among those hits; to find them in raw data one has to know in advance that they mean fissure.",
"s.hits.xml": "Raw codes (XML / literals)", "s.hits.ont": "SDCO subsumption query", "s.hits.combos": "{n} literal combinations in {c} codes to list by hand", "s.hits.one": "1 pattern, {n} hits", "s.hits.sub": "SDCO defines {n} sub-classes of Fissure; the hits fall into:", "s.hits.hits": "hits",
"s.q.title": "Ask the data: six questions",
"s.q.intro": "Each SPARQL query was executed for real against the merged graph when the page was built. Choose a question.",
"s.q.sparql": "SPARQL", "s.q.answer": "Answer", "s.q.without": "Without SDCO", "s.q.hits": "{n} results", "s.q.run": "run on the merged SDCO + m150-onto graph",
"q.q1.question": "Show me every fissure in the network",
"q.q1.why": "Pipe fissures (BAB) and manhole fissures (DAB) are one concept in the taxonomy.",
"q.q1.without": "BAB (pipe fissure) and DAB (manhole fissure) share no common pattern in the raw codes. A code-only query only groups them if a human already knows the code table.",
"q.q2.question": "Which damages run vertically?",
"q.q2.why": "Orientation is a property of the damage, not a letter in a characterisation field.",
"q.q2.without": "The orientation hides in the second characterisation field, whose letters mean something different for each code. No equivalent query over the raw m150 data exists.",
"q.q3.question": "Which observations are structural defects, and which are just inventory notes?",
"q.q3.why": "The top of the taxonomy separates structural defects, operational defects, inventory and other observations.",
"q.q3.without": "The second letter of the code roughly correlates with this split by convention of the standard, but nothing in the raw data states it; a query has to hard-code the letter convention.",
"q.q4.question": "Where are the root intrusions?",
"q.q4.why": "A single class (ComplexMassRoots) replaces a code plus a characterisation.",
"q.q4.without": "Needs code BBA and characterisation 1 = “C”: two fields that must be combined by hand.",
"q.q5.question": "Which manholes show infiltration?",
"q.q5.why": "Different characterisations of the same code end up in different classes.",
"q.q5.without": "Both results come from the same raw code (DBF); which kind of infiltration it is depends on which characterisation field holds which letter. That is not discoverable from the code string alone.",
"q.q6.question": "Which reports are not damage at all?",
"q.q6.why": "Inventory features and other observations are classes of their own.",
"q.q6.without": "No single field marks a report as “not damage”. An analyst has to list every non-damage code by hand, with no way to check the list is complete.",
"s.tree.title": "The taxonomy the sample falls into",
"s.tree.intro": "Pruned view of the classes below <code>Observation</code> that at least one report of the sample belongs to. The number is the count of reports; open a node to see its subclasses.",
"s.facts.title": "How it is built, and where it stops",
"s.f.1.t": "Classes, not individuals", "s.f.1.b": "Each of the {u}+ codes is an OWL class defined by <code>owl:equivalentClass</code> over the literal condition code. Punning was removed: taxonomy links use <code>someValuesFrom</code> restrictions.",
"s.f.2.t": "Existential restrictions", "s.f.2.b": "{svf} <code>someValuesFrom</code> restrictions give automatic subsumption. The price: a reasoner never writes the filler as a triple. That is why the materialization script exists ({m} triples for {ms} reports here).",
"s.f.3.t": "Imports m150-onto", "s.f.3.b": "<code>SDCO.rdf</code> imports m150-onto, resolved locally through an XML catalog. Terms of the data format stay in the m150-onto namespace, damage taxonomy terms live in the SDCO namespace.",
"s.f.4.t": "Limits", "s.f.4.b": "The fast classification covers only the two <code>equivalentClass</code> patterns SDCO uses today. Everything shown is measured on one sample dataset ({reports} reports, {u} of the {tc} codes occur).",
"colophon": "Built from {sdco} triples (SDCO.rdf), {tbox} triples (m150-onto.rdf), {data} triples (m150-onto-parsed-dwa.rdf) and {mat} triples (materialized). Inspection dates in the sample: {d0} to {d1}."
},

"b.kicker": "Mehrwert gegenüber dem XML-Standard",
"b.h1": "Was die Ontologien dem XML-Austauschformat hinzufügen.",
"b.lead": "Sechs konkrete Unterschiede, jeweils als XML heute neben demselben Sachverhalt mit den Ontologien. m150-onto und SDCO sind Ergebnisse des Projekts KaSyTwin. Das Etikett auf jeder Karte sagt, ob der Punkt mit echten Daten auf dieser Seite gezeigt wird oder nur eine Möglichkeit ist.",
"b.legend.demo": "beim Erzeugen der Seite aus den echten Dateien berechnet und hier gezeigt",
"b.legend.fut": "ein Argument oder Beispiel, noch nicht an echten Daten gezeigt",
"b.xml": "XML heute",
"b.ont": "Mit den Ontologien",
"b.next": "Der Mehrwert beruht auf den drei Ebenen, die in den anderen Tabs erklärt werden.",
"b.full": "Ganze Szene",
"b.1.title": "Abfragbarkeit",
"b.1.intro": "„Zeige mir jeden Riss.“ In XML braucht das XPath plus eine Kodeliste, die jemand pflegen muss. Mit den Ontologien genügt ein einziges Unterklassenmuster, und später in die Taxonomie aufgenommene Kodes sind automatisch enthalten.",
"b.1.note": "Dieselbe Frage und dieselben Zahlen wie in der SDCO-Szene „Alle Risse“, hier in Kurzform. Die SPARQL-Seite wurde vom Build ausgeführt; das XPath wird aus derselben Kodeliste erzeugt und wurde nicht ausgeführt.",
"b.1.xml": "XPath plus eine Kodeliste, die jemand vollständig halten muss. In dieser Stichprobe stammen die Treffer aus {n} Kodes; ein Haltungs- und ein Schachtkode liegen sogar in verschiedenen Elementen (<code>HZ</code> gegenüber <code>KZ</code>).",
"b.1.ont": "Ein Muster. {hits} Treffer in der Stichprobe; SDCO definiert {sub} Unterklassen von <code>Fissure</code>, und eine später ergänzte Unterklasse wird erfasst, ohne die Abfrage anzufassen.",
"b.2.title": "Schlussfolgern und Klassifizieren",
"b.2.intro": "In XML ist ein Kode eine Zeichenkette. Mit SDCO macht dieselbe Zeichenkette den Bericht zum Mitglied einer Kette von Klassen, und ein Reasoner ermittelt, welche das sind.",
"b.2.note": "Der ausgewählte Bericht <code>{report}</code>; die Klassen sind so, wie der Build sie neu hergeleitet hat (Szene „Der Reasoner klassifiziert den Bericht“ im SDCO-Tab).",
"b.2.xml": "Drei Zeichenketten. Nichts in der Datei sagt, dass dies ein Riss ist oder dass er in Längsrichtung verläuft.",
"b.2.ont": "Für diesen einen Bericht werden {n} Klassen gefolgert, und seine Merkmale steigen in der Taxonomie auf:",
"b.3.title": "Neue Fakten durch Inferenz",
"b.3.intro": "Die Materialisierung schreibt die gefolgerten Fakten als gewöhnliche Tripel auf. Sie sind in den Daten vorhanden, abfragbar und exportierbar, und niemand hat sie eingetippt.",
"b.3.note": "Zahlen aus der materialisierten Datei; das Beispieltripel gehört zum ausgewählten Bericht <code>{report}</code>.",
"b.3.xml": "Für diesen Bericht wurden {n} Elemente eingetragen. Mehr enthält die Datei nicht.",
"b.3.ont": "Für den Bericht wurden {typed} Werte erfasst; der Build hat dazu {for} weitere Tripel hergeleitet, zum Beispiel:",
"b.3.total": "Tripel, die niemand eingetippt hat, über {subjects} Berichte",
"b.4.title": "Konsistenzprüfung",
"b.4.intro": "DIN EN 13508-2 macht die zulässigen Charakterisierungsbuchstaben vom Hauptkode abhängig. Ein Schema prüft jedes Feld für sich; der Zusammenhang zwischen zwei Feldern ist eine eigene Regel.",
"b.4.note": "Die Prüfung läuft im Build: Nach der Klassifikation muss jede Meldung, deren Kodeklasse Charakterisierungs-Unterklassen hat, in eine davon fallen (SPARQL über den klassifizierten Graphen, {codes} Kodes, {dims} Kombinationen aus Kode und Dimension). SDCO bildet nicht ab, welche Charakterisierungen verpflichtend sind; ein fehlender Buchstabe wird deshalb nie markiert, nur ein Buchstabe ohne passende Unterklasse. Ein Schema müsste solche Regeln je Kode wiederholen; XSD 1.1 <code>xs:assert</code> könnte einige ausdrücken. Das in der Beispieldatei genannte Schema (<code>{xsd}</code>) liegt nicht in diesem Repository, was es prüft, wurde deshalb nicht untersucht.",
"b.4.unv": "Nicht verifiziert und aus der Prüfung genommen: {list} (die Buchstaben überspringen einen, die Unterklassenmenge könnte unvollständig sein).",
"b.4.xml": "Ein Datensatz, wie die Felder ihn halten. <code>{f1}</code> und <code>{f2}</code> haben eigene Wertelisten. Die für <code>{f1}</code> über alle Kodes verwendeten Buchstaben sind:",
"b.4.xml2": "Eine Prüfung je Feld kann {v} hier akzeptieren, weil andere Kodes es verwenden. Dass {v} für <code>{code}</code> falsch ist, ist eine Regel über zwei Felder zusammen.",
"b.4.ont": "SDCO bindet die Buchstaben an den Kode. Für <code>{code}</code> gibt es Unterklassen nur für:",
"b.4.real": "Ausgeführt auf den {n} Beispielmeldungen:",
"b.4.real.n": "{v} Meldungen verletzen sie ({c} geprüft)",
"b.4.real.row": "{code}, {f}: Buchstabe {val}, {n}x, in keiner Unterklasse",
"b.4.real.why": "Für diese Buchstaben hat SDCO keine Unterklasse. Ob es Datenfehler, eine nationale Erweiterung oder eine Lücke in SDCO ist, wird hier nicht entschieden.",
"b.4.ctor": "Konstruiertes Beispiel, keine echten Daten:",
"b.4.ctor.flag": "als <code>:{code}</code> typisiert, aber in keiner der <code>{code}{d}_*</code>-Klassen, die Prüfung markiert es.",
"b.4.f": "Charakterisierung",
"b.4.dim1": "char1", "b.4.dim2": "char2",
"b.5.title": "Integration über Datenquellen hinweg",
"b.5.intro": "Gemeinsame IRIs lassen Kanaldaten mit anderen Daten verknüpfen, ohne für jedes Werkzeugpaar einen eigenen Import zu schreiben.",
"b.5.note": "m150-onto und SDCO sind Teil des Projekts KaSyTwin. Die Verknüpfungen von m150-onto nach SDCO sind echt (Graph im Überblick). Die Verknüpfungen zu GIS, BIM, hydraulischen Modellen und Sanierungsplanung sind Möglichkeiten, die dieser Entwurf zulässt; keine davon ist umgesetzt oder hier gezeigt.",
"b.5.xml": "Kennungen haben nur innerhalb einer Datei eine Bedeutung. Wer andere Daten dazunehmen will, braucht für jede Quelle und jedes Werkzeug einen handgeschriebenen Import.",
"b.5.ont": "Jedes Individuum und jede Klasse hat eine IRI. In der Haltung des Überblicksgraphen führen {x} Kanten von m150-onto-Daten in SDCO-Klassen.",
"b.5.pot": "Mögliche weitere Verknüpfungen:",
"b.5.dis": "Möglich: Beschreiben zwei Quellen denselben Schaden und sind als dasselbe Objekt verknüpft, machen disjunkte Klassen (hier {a} und {b}, eine von {n} paarweise disjunkten Klassen) einen Widerspruch zwischen ihnen sichtbar. Nicht gezeigt.",
"b.5.g1": "GIS",
"b.5.g2": "BIM",
"b.5.g3": "Hydraulische Modelle",
"b.5.g4": "Sanierungsplanung",
"b.5.graph": "Graph öffnen",
"b.6.title": "Unabhängigkeit von Hersteller und Version",
"b.6.intro": "Mit den Ontologien wandert die Bedeutung mit den Daten, statt in einem einzelnen Produkt zu stecken.",
"b.6.note": "Die versionierte IRI und der Import sind aus <code>SDCO.rdf</code> gelesen. Dass das Werkzeug eines anderen Herstellers sie liest, wird hier nicht gezeigt.",
"b.6.xml": "Die Bedeutung eines Kodes steckt in jedem Programm und in einem PDF der Norm. Eine neue Ausgabe der Norm heißt: Jedes Programm wird einzeln aktualisiert, oder gar nicht.",
"b.6.ont": "Ein Bericht verweist auf <code>sdco:{code}</code>. Die Bedeutung wird einmal veröffentlicht, und jede Version hat eine eigene IRI:",
"b.6.imp": "importiert",
"ov.why.title": "Warum nicht einfach bessere XML-Software?",
"ov.why.intro": "Ein berechtigter Einwand: Wer im Inspektionsfahrzeug sitzt, kann <code>&lt;{xmlCodeTag}&gt;{code}&lt;/{xmlCodeTag}&gt;</code> nicht lesen, aber Software, die die XML-Datei liest, kann lesbare Bezeichnungen anzeigen. Das stimmt. Entscheidend ist jedoch, woher der Viewer sein Wissen hat: Dass <code>{code}</code> für „{meaning}“ steht, weiß er nur, weil ein Entwickler die Tabellen der DIN EN 13508-2 und der DWA-M 150 dort hineingeschrieben hat.",
"ov.why.today": "Heute: Jedes Werkzeug trägt seine eigene Kopie der Kodetabelle",
"ov.why.shared": "Mit den Ontologien: Alle Werkzeuge greifen auf eine gemeinsame Ebene zu",
"ov.why.tool": "Werkzeug {x}",
"ov.why.miss": "fehlt",
"ov.why.stale": "veraltet",
"ov.why.layer": "SDCO + m150-onto",
"ov.why.layers": "offen, versioniert, maschinenlesbar (SDCO {version})",
"ov.why.a.t": "Wo die Bedeutung heute steckt",
"ov.why.a.b": "Versteckt im Programmcode jedes Herstellers, in jedes Werkzeug einzeln kopiert, jede Kopie mit eigenen Fehlern, und an diese Software gebunden: Ändert sich die Norm oder wird das Werkzeug abgelöst, geht das Wissen mit.",
"ov.why.b.t": "Was die Ontologien ändern",
"ov.why.b.b": "Sie holen dieses Wissen aus der Software heraus und veröffentlichen es einmal, als offene, versionierte, maschinenlesbare Daten, die jedes Werkzeug nutzen kann, auch proprietäre. Die Ontologie ist die Ebene unterhalb der Software, kein Konkurrent dazu.",
"ov.why.c.t": "Wer profitiert, ehrlich gesagt",
"ov.why.c.b": "Wer im Fahrzeug inspiziert, merkt davon kaum etwas direkt. Hauptnutzer sind Netzbetreiber, Anlagenverwalter, Planer und Werkzeugentwickler. Inspekteure profitieren mittelbar, durch bessere Eingabeprüfung und einheitlichere Klassifikation. Diese Verbesserung des Arbeitsablaufs ist ein Potenzial; gemessen wurde sie nicht.",

"s.h1": "Den Kodes eine Bedeutung geben, die Maschinen nutzen können.",
"s.lead": "SDCO (Sewer Damage Classification Ontology) formalisiert <strong>DIN EN 13508-2</strong>, das europäische Kodiersystem für die optische Inspektion von Entwässerungssystemen. Schadenskodes werden zu OWL-<strong>Klassen</strong>; SDCO importiert m150-onto und arbeitet daher direkt auf den Zustandsberichten aus dem vorigen Tab.",

"s.lift.intro": "Die Zeichenkette <code>{code}</code> aus dem Bericht wird durch ein <code>equivalentClass</code>-Axiom der Klasse <code>:{code}</code> zugeordnet. Deren <code>subClassOf</code>-Restriktionen ordnen sie anschließend in die Taxonomie ein.",
"s.lift.note": "Axiome und Klassenketten sind aus <code>SDCO.rdf</code> gelesen. Eine Klassenkette liest sich von der spezifischen Klasse nach oben: Jeder Pfeil bedeutet „ist Unterklasse von“.",
"s.lift.axioms": "Axiome der Klasse", "s.lift.equiv": "äquivalent zu (trifft das Literal)", "s.lift.sub": "Unterklasse von (Restriktion)", "s.lift.chains": "Einordnung der beiden für diesen Bericht gefundenen Merkmale in die Taxonomie",
"s.reason.title": "Der Reasoner klassifiziert den Bericht",
"s.reason.intro": "Ausgehend von den drei Literalen des Berichts greifen die Klassendefinitionen nacheinander. Zum Schluss werden die existenziellen Restriktionen in einfache, abfragbare Tripel überführt.",
"s.reason.note": "Der schnelle Standardpfad wertet die <code>equivalentClass</code>-Muster (einfacher Wert oder ein zusätzlicher Wert auf einer Kodeklasse) per SPARQL UPDATE vorwärtsverkettend aus; HermiT über <code>--reason</code> bleibt als Referenz zur Korrektheitsprüfung erhalten. Das unten gezeigte Materialisierungsergebnis wurde beim Erzeugen der Seite neu hergeleitet und entspricht dem Eintrag in der materialisierten Datei.",
"s.r.1": "In m150-onto angegeben", "s.r.2": "Klassen, in die der Bericht fällt", "s.r.3": "Was diese Klassen implizieren", "s.r.4": "Materialisierte Tripel",
"s.r.2why": "Eine Klasse trifft zu, wenn der Bericht das Literal (bzw. die Literale) ihrer <code>equivalentClass</code>-Definition hat.",

"s.r.4why": "Ein SPARQL-CONSTRUCT behält je Eigenschaft nur die spezifischste Klasse und schreibt sie als Tripel.",
"s.hits.title": "„Alle Risse“: eine Abfrage statt einer Kodeliste",
"s.hits.intro": "Dieselbe Frage zweimal gestellt. Ohne Ontologie muss eine Abfrage jede Kode- und Charakterisierungskombination aufzählen, die einen Riss bedeutet. Mit SDCO fragt man nach allem unterhalb von <code>Fissure</code>.",
"s.hits.note": "Treffer im Beispieldatensatz ({reports} Berichte). Die linke Liste zeigt die Kombinationen aus (Kode, Charakterisierung 1, Charakterisierung 2), die unter diesen Treffern tatsächlich vorkommen; in Rohdaten muss man vorab wissen, dass sie einen Riss bedeuten.",
"s.hits.xml": "Rohkodes (XML / Literale)", "s.hits.ont": "SDCO-Subsumptionsabfrage", "s.hits.combos": "{n} Literal-Kombinationen in {c} Kodes, von Hand aufzulisten", "s.hits.one": "1 Muster, {n} Treffer", "s.hits.sub": "SDCO definiert {n} Unterklassen von Fissure; die Treffer verteilen sich so:", "s.hits.hits": "Treffer",
"s.q.title": "Die Daten befragen: sechs Fragen",
"s.q.intro": "Jede SPARQL-Abfrage wurde beim Erzeugen der Seite tatsächlich auf dem zusammengeführten Graphen ausgeführt. Wählen Sie eine Frage.",
"s.q.sparql": "SPARQL", "s.q.answer": "Antwort", "s.q.without": "Ohne SDCO", "s.q.hits": "{n} Ergebnisse", "s.q.run": "ausgeführt auf dem zusammengeführten SDCO- und m150-onto-Graphen",
"q.q1.question": "Zeige mir jeden Riss im Netz",
"q.q1.why": "Haltungsrisse (BAB) und Schachtrisse (DAB) sind in der Taxonomie ein einziges Konzept.",
"q.q1.without": "BAB (Riss in der Haltung) und DAB (Riss im Schacht) haben in den Rohkodes kein gemeinsames Muster. Eine reine Kodeabfrage fasst sie nur zusammen, wenn man die Kodetabelle bereits kennt.",
"q.q2.question": "Welche Schäden verlaufen vertikal?",
"q.q2.why": "Die Orientierung ist eine Eigenschaft des Schadens, kein Buchstabe in einem Charakterisierungsfeld.",
"q.q2.without": "Die Orientierung steckt im zweiten Charakterisierungsfeld, dessen Buchstaben je Kode etwas anderes bedeuten. Über die rohen m150-Daten allein gibt es keine gleichwertige Abfrage.",
"q.q3.question": "Welche Beobachtungen sind Strukturschäden und welche nur Bestandsangaben?",
"q.q3.why": "Die Spitze der Taxonomie trennt Strukturschäden, Betriebsschäden, Bestandsmerkmale und sonstige Beobachtungen.",

"q.q4.question": "Wo gibt es Wurzeleinwuchs?",
"q.q4.why": "Eine einzelne Klasse (ComplexMassRoots) ersetzt einen Kode plus eine Charakterisierung.",
"q.q4.without": "Erfordert Kode BBA und Charakterisierung 1 = „C“: zwei Felder, die von Hand kombiniert werden müssen.",
"q.q5.question": "Welche Schächte zeigen Infiltration?",

"q.q5.without": "Beide Ergebnisse stammen aus demselben Rohkode (DBF); welche Art von Infiltration vorliegt, hängt davon ab, welches Charakterisierungsfeld welchen Buchstaben trägt. Das lässt sich aus der Kodezeichenkette allein nicht ableiten.",
"q.q6.question": "Welche Berichte sind gar kein Schaden?",
"q.q6.why": "Bestandsmerkmale und sonstige Beobachtungen sind eigene Klassen.",
"q.q6.without": "Kein einzelnes Feld kennzeichnet einen Bericht als „kein Schaden“. Man muss jeden Nicht-Schadens-Kode von Hand auflisten, ohne prüfen zu können, ob die Liste vollständig ist.",
"s.tree.title": "Die Taxonomie, in die die Stichprobe fällt",
"s.tree.intro": "Gekürzte Ansicht der Klassen unterhalb von <code>Observation</code>, zu denen mindestens ein Bericht der Stichprobe gehört. Die Zahl ist die Anzahl der Berichte; ein Knoten lässt sich aufklappen, um seine Unterklassen zu sehen.",
"s.facts.title": "Wie es gebaut ist, und wo es endet",

<script>
(function () {
'use strict';
const D = JSON.parse(document.getElementById('sdco-data').textContent);
const I18N = JSON.parse(document.getElementById('i18n').textContent);
const LG = D.linkedGraph;
const F = D.m150.featured, MS = D.m150.stats, ST = D.stats, FI = D.m150.fissure, B = D.benefits;
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let lang = 'en';
try { const s = localStorage.getItem('sdco-lang'); if (s === 'de' || s === 'en') lang = s; } catch (e) {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = n => Number(n).toLocaleString(lang === 'de' ? 'de-DE' : 'en-US');
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const delay = s => `style="--d:${s.toFixed(2)}s"`;

// Variables available inside every {placeholder} of a translated string (all measured by the build).
const VARS = () => ({
  report: B.inference.report, codes: nf(B.consistency.coverage.codes), dims: nf(B.consistency.coverage.dimensions), xsd: B.consistency.xsd, code: F.code, meaning: B.vendorRows[0].meaning, version: B.version, xmlCodeTag: F.xmlRows.find(r => r.prop === 'hasConditionCode').tag, asset: F.assetId, xmlPath: F.xmlPath, xmlName: 'DWA M 150 Beispiel 04_2010 Typ B .xml',
  reports: nf(ST.reportCount), p: nf(ST.pipeSectionCount), n: nf(ST.nodeCount),
  u: nf(ST.codeCount), tc: nf(ST.totalCodeCount), tags: nf(MS.xmlDistinctTags),
  eq: nf(ST.axioms.equivalentClass), svf: nf(ST.axioms.someValuesFrom),
  m: nf(ST.materializedTripleCount), ms: nf(ST.materializedSubjectCount),
  sdco: nf(ST.tripleCounts['SDCO.rdf']), tbox: nf(ST.tripleCounts['m150-onto.rdf']),
  data: nf(ST.tripleCounts['m150-onto-parsed-dwa.rdf']), mat: nf(ST.tripleCounts['m150-onto-parsed-dwa_materialized.rdf']),
  lgAsset: LG.asset, lgReports: LG.edges.filter(e => e.label === 'm150:isChildOf').length, lgNodes: LG.nodes.filter(n => !n.detail).length, lgEdges: LG.edges.filter(e => !e.detail).length,
  lgNodesM: LG.nodes.filter(n => n.ns === 'm150' && !n.detail).length, lgEdgesM: LG.edges.filter(e => !e.detail && !/^(sdco|rdf|rdfs):/.test(e.label)).length, lgDetN: LG.nodes.filter(n => n.detail && !n.hd).length, lgHdN: LG.nodes.filter(n => n.hd).length,
  d0: (ST.inspectionDateRange.min || '').slice(0, 10), d1: (ST.inspectionDateRange.max || '').slice(0, 10)
});
function t(key, extra) {
  const s = I18N[lang][key];
  if (s === undefined) return '[' + key + ']';
  const v = Object.assign(VARS(), extra || {});
  return s.replace(/\{(\w+)\}/g, (_, k) => (k in v ? v[k] : '{' + k + '}'));
}

/* ---------- scene machinery: restartable animations ---------- */
function restart(stage) { stage.classList.remove('play'); void stage.offsetWidth; stage.classList.add('play'); }
function countUp(root) {
  $$('[data-count]', root).forEach(el => {
    const end = +el.dataset.count;
    if (reduce) { el.textContent = nf(end); return; }
    const t0 = performance.now(), dur = 1100;
    const tick = now => { const k = Math.min(1, (now - t0) / dur); el.textContent = nf(Math.round(end * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
function playScene(id) {
  const art = $(`[data-scene="${id}"]`); if (!art) return;
  const stage = $('.stage', art); if (!stage) return;
  restart(stage); countUp(stage);
  if (id === 'queries') typeQuery();
  if (id === 'linked') renderLinked(true);
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { io.unobserve(e.target); playScene(e.target.dataset.scene); }
}), { threshold: .25 }) : null;
function observeVisible() {
  if (!io) return;
  $$('.panel:not([hidden]) [data-scene]').forEach(a => io.observe(a));
}

/* ---------- small renderers ---------- */
function hl(src) {
  return src.split('\n').map(l => {
    let h = esc(l);
    h = h.replace(/(&lt;[^&]*?&gt;)|("[^"]*")|(\?[A-Za-z_]\w*)|\b(PREFIX|SELECT|WHERE|UNION|FILTER|VALUES|NOT|EXISTS|IN|REGEX)\b|\b([a-z0-9]+:)([A-Za-z0-9_]*)/g,
      (m, iri, str, v, kw, pf, loc) => iri ? `<span class="pf">${iri}</span>` : str ? `<span class="str">${str}</span>` : v ? `<span class="var">${v}</span>` : kw ? `<span class="kw">${kw}</span>` : `<span class="pf">${pf}</span>${loc}`);
    return h;
  });
}
function codeBlock(src, typing) {
  return `<pre class="code ${typing ? 'typing' : ''}">${hl(src).map((h, i) => `<span class="ln" ${delay(Math.min(i * .06, 1.4))}>${h}&#8203;</span>`).join('')}</pre>`;
}
const chipLit = s => `<span class="chip lit">${esc(s)}</span>`;
const chipCls = s => `<span class="chip cls">${esc(s)}</span>`;
function tripleHtml(tr) {
  const o = tr.o, ds = o.datatype ? ` <span class="dt">^^${esc(o.datatype)}</span>` : '';
  const ov = o.kind === 'lit' ? `<span class="o lit">"${esc(o.text)}"</span>${ds}` : `<span class="o iri">${esc(o.text)}</span>`;
  return `<span class="trip"><span class="s">:report</span> <span class="p">${esc(tr.p)}</span> ${ov}</span>`;
}

/* ---------- O1: pipeline ---------- */
function renderPipeline() {

/* ---------- O3: linked-data graph (layered columns, drag, hover, select) ---------- */
let lgMode = 'sdco', lgDet = false, lgHd = false, lgView = null;
function renderLinked(animate) {
  const host = $('#st-linked');
  const NS = 'http://www.w3.org/2000/svg';
  const nodes = LG.nodes.map(n => ({ ...n, label: n.labels ? n.labels[lang] : n.label })), byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const edges = LG.edges.map(e => ({ ...e, a: byId[e.source], b: byId[e.target] }));
  edges.forEach(e => { e.cross = e.a.ns !== e.b.ns; });
  // ---- layered layout: column by role, rows by barycentre of the neighbours in earlier columns ----
  const CW = 200, X0 = 290, XH = 100, XR = 120, TOP = 56, ROW = 112, GAP = 38, MAXC = 28;
  nodes.forEach(n => { n.col = n.detail ? 0 : n.id === LG.asset ? 0 : n.ns === 'm150' ? (/Inspection/.test(n.id) ? 1 : 2) : -1; });
  edges.forEach(e => { if (e.label === 'rdf:type') e.b.col = 3; else if (e.label.startsWith('sdco:')) e.b.col = 4; });
  for (let k = 0; k < 4; k++) edges.forEach(e => { if (e.label === 'rdfs:subClassOf') e.b.col = Math.max(e.b.col, e.a.col + 1); });
  const core = nodes.filter(n => !n.detail), det = nodes.filter(n => n.detail && !n.hd), hdn = nodes.filter(n => n.hd);
  const reports = core.filter(n => n.col === 2 && n.kind === 'individual');
  reports.forEach((n, i) => { n.y = TOP + 16 + i * ROW; });
  core.filter(n => n.kind === 'literal').forEach(n => { const r = edges.find(e => e.b === n).a; n.y = r.y + 36; });
  const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
  core.filter(n => n.col <= 1).forEach(n => { n.y = mean(reports.map(r => r.y)); });
  // inspection details: a fan in column 0 above/below the inspection row (objects with their label literal underneath)
  const insp = core.find(n => n.col === 1), SL = [-240, -160, -80, 80, 160, 240];
  det.filter(n => edges.some(e => e.b === n && e.a === insp)).forEach((n, i) => { n.x = X0; n.y = insp.y + SL[i]; });
  // Haltung details: a fan in its own column left of the Haltung (clear of the inspection fan), centred on the Haltung
  const hal = core.find(n => n.id === LG.asset), HS = 52;
  hdn.forEach((n, i) => { n.x = XH; n.y = hal.y + (i - (hdn.length - 1) / 2) * HS; });
  det.filter(n => n.y === undefined).forEach(n => { n.x = X0; n.y = edges.find(e => e.b === n).a.y + 36; });
  const ncol = Math.max(...core.map(n => n.col)) + 1;
  for (let c = 3; c < ncol; c++) {
    const col = nodes.filter(n => n.col === c);
    col.forEach(n => { n.bary = mean(edges.filter(e => e.b === n && e.a.col < c).map(e => e.a.y)); });
    col.sort((p, q) => p.bary - q.bary || (p.id < q.id ? -1 : 1));
    let prev = -1e9;
    col.forEach(n => { n.y = Math.max(n.bary, prev + GAP); prev = n.y; });
    // re-centre each block of pushed nodes on its own barycentres (undo the downward bias of the sweep)
    for (let i = 0; i < col.length;) {
      let j = i; while (j + 1 < col.length && col[j + 1].y - col[j].y <= GAP + .5) j++;
      const sh = (mean(col.slice(i, j + 1).map(n => n.bary)) - mean(col.slice(i, j + 1).map(n => n.y)));
      const lo = i ? col[i - 1].y + GAP : -1e9;
      const d = Math.max(sh, lo - col[i].y);
      for (let k = i; k <= j; k++) col[k].y += d;
      i = j + 1;
    }
  }
  nodes.forEach(n => { if (!n.detail) n.x = X0 + n.col * CW; });
  const minY = Math.min(...nodes.map(n => n.y));
  if (minY < TOP) nodes.forEach(n => { n.y += TOP - minY; });
  const W = X0 + XR + (ncol - 1) * CW, H = Math.ceil(Math.max(...nodes.map(n => n.y)) + 46);
  const bx = X0 + 2.5 * CW; // viewBox is the same in both modes (no jump while recording)
  const sdEdge = e => e.a.ns === 'sdco' || e.b.ns === 'sdco'; // boundary between m150-onto (cols 0-2) and SDCO (cols 3+)
  host.innerHTML = `<div><div class="lgscroll"><svg class="lg" viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(t('ov.lg.aria'))}"></svg></div>
    <div class="lgtools"><div class="legend" id="lg-legend"></div></div><p class="note" style="padding:.6rem 0 0">${t('ov.lg.hint')}</p></div>
    <div class="lgpanel"><div><div class="label">${t('ov.lg.selected')}</div><div class="lgsel" id="lg-sel"></div><div class="lgiri" id="lg-iri"></div></div>
    <div><div class="label">${t('ov.lg.tr')}</div><ul class="lgtr" id="lg-tr"></ul></div></div>`;
  const svg = $('svg.lg', host);
  const mk = (tag, attrs, par) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); (par || svg).appendChild(el); return el; };
  mk('line', { class: 'bnd sd', x1: bx, x2: bx, y1: 8, y2: H - 8 });
  [['m150-onto', bx - 8, 'end'], ['SDCO', bx + 8, 'start']].forEach(([s, x, a]) => { const el = mk('text', { class: 'bt' + (s === 'SDCO' ? ' sd' : ''), x, y: 22, 'text-anchor': a }); el.textContent = s; });
  const gE = mk('g', {}), gL = mk('g', {}), gN = mk('g', {});
  edges.forEach((e, i) => {
    const vc = (sdEdge(e) ? ' sd' : '') + (e.hd ? ' hd' : e.detail ? ' dt' : '');
    e.el = mk('path', { class: 'e draw' + (e.cross ? ' x' : '') + vc, pathLength: 1 }, gE); e.el.style.setProperty('--d', (.2 + i * .012) + 's');
    e.tx = mk('text', { class: 'el' + vc }, gL); e.tx.textContent = e.label;
  });
  const R = n => (n.id === LG.asset ? 13 : 9);
  const short = s => (s.length > MAXC ? s.slice(0, MAXC - 1) + '…' : s);
  nodes.forEach((n, i) => {
    n.g = mk('g', { class: `n ${n.ns} ${n.kind}${n.ns === 'sdco' ? ' sd' : ''}${n.hd ? ' hd' : n.detail ? ' dt' : ''}`, tabindex: 0, role: 'button', 'aria-label': n.label }, gN);
    const inner = n.inner = mk('g', { class: 'pop' }, n.g); inner.style.setProperty('--d', (i * .018) + 's');
    mk('circle', { r: 18, fill: 'transparent' }, inner);
    n.kind === 'class' ? mk('rect', { class: 'sh', x: -9, y: -9, width: 18, height: 18, rx: 4 }, inner)
      : n.kind === 'literal' ? mk('rect', { class: 'sh', x: -7, y: -7, width: 14, height: 14, rx: 2, transform: 'rotate(45)' }, inner)
      : mk('circle', { class: 'sh', r: R(n) }, inner);
    const tx = mk('text', { y: R(n) + 14 }, inner); tx.textContent = short(n.label);
    const ti = mk('title', {}, inner); ti.textContent = n.label + (n.iri ? '\n' + n.iri : '');
    let drag = null;
    n.g.addEventListener('pointerdown', ev => { drag = { x: ev.clientX, y: ev.clientY, moved: false }; n.g.setPointerCapture(ev.pointerId); ev.preventDefault(); });
    n.g.addEventListener('pointermove', ev => {
      if (!drag) return;
      if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) > 4) drag.moved = true;
      if (!drag.moved) return;
      const r = svg.getBoundingClientRect(), k = W / r.width;
      n.x = Math.min(W - 40, Math.max(40, (ev.clientX - r.left) * k)); n.y = Math.min(H - 30, Math.max(30, (ev.clientY - r.top) * k));
      n.pin = true; n.g.classList.add('pin'); draw();
    });
    n.g.addEventListener('pointerup', () => { if (drag && !drag.moved) select(n); drag = null; });
    n.g.addEventListener('pointercancel', () => { drag = null; });
    n.g.addEventListener('dblclick', () => { n.pin = false; n.g.classList.remove('pin'); n.x = n.x0; n.y = n.y0; draw(); });
    n.g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(n); } });
    n.g.addEventListener('mouseenter', () => focusOn(n)); n.g.addEventListener('mouseleave', () => focusOn(cur));
    n.g.addEventListener('focus', () => focusOn(n)); n.g.addEventListener('blur', () => focusOn(cur));
    n.x0 = n.x; n.y0 = n.y;
  });
  const legend = [];
  const seen = new Set(nodes.map(n => n.ns + '.' + n.kind));
  const swatch = { 'm150.individual': 'border-color:var(--accent);background:#fdf6ec;border-radius:50%', 'm150.literal': 'border-color:var(--accent);background:#fdf6ec;border-style:dashed', 'sdco.class': 'border-color:var(--link);background:#edf6f7', 'sdco.individual': 'border-color:var(--link);background:#edf6f7;border-radius:50%' };
  Object.keys(swatch).filter(k => seen.has(k)).forEach(k => legend.push(`<span${k.startsWith('sdco') ? ' class="sd"' : ''}><i style="${swatch[k]}"></i>${t('ov.lg.leg.' + k)}</span>`));
  legend.push(`<span class="sd"><i class="line"></i>${t('ov.lg.leg.cross')}</span>`);
  $('#lg-legend', host).innerHTML = legend.join('');

  function draw() {
    nodes.forEach(n => n.g.setAttribute('transform', `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`));

  let cur = null;

const X = D.explorer, XC = X.codes, XK = Object.keys(XC).sort(), DM = X.demo;
const CATC = { Fabric: 'var(--warn)', Operation: 'var(--accent)', Inventory: 'var(--link)', Other: 'var(--muted)' };
const catOf = code => XC[code].family.replace(/^(Pipe|Node)/, '');
const DIMS = ['char1', 'char2'];
const humanizeF = s => s.replace(/([a-z])([A-Z])/g, '$1 $2');
const LETTERS = { char1: {}, char2: {} }; // dimension -> letter -> codes that define it
XK.forEach(c => DIMS.forEach(dm => { const d = XC[c].dims[dm]; if (d) d.options.forEach(o => (LETTERS[dm][o.value] = LETTERS[dm][o.value] || []).push(c)); }));
const HAY = {};
XK.forEach(c => { const d = XC[c]; HAY[c] = [c, d.label, d.meaning, d.comment].concat(...DIMS.map(dm => (d.dims[dm] ? d.dims[dm].options : []).map(o => (o.filler ? o.filler.label : '') + ' ' + o.label))).filter(Boolean).join(' ').toLowerCase(); });
let exCode = XC.BAB ? 'BAB' : XK[0], exQ = '';
let cl = { code: DM.presets[0].code, c1: DM.presets[0].char1 || '', c2: DM.presets[0].char2 || '' };
let planSel = null;
const dimN = dm => dm === 'char1' ? 1 : 2;
const clKey = dm => dm === 'char1' ? 'c1' : 'c2';
const chainRev = names => names.slice().reverse().map((c, i) => (i ? '<span class="lnk"><i></i>⊑</span>' : '') + chipCls(c)).join('');

// The two documented pattern shapes (as in classify_individuals()): code literal -> code class; code + one letter -> subclass.
function classify(code, c1, c2) {
  const d = XC[code], classes = [], flags = [];
  if (!d) return { d, classes, flags };
  classes.push({ cls: d.cls, label: d.label, kind: 'code' });
  [['char1', c1], ['char2', c2]].forEach(([dm, v]) => {
    if (!v) return;
    const o = (d.dims[dm] ? d.dims[dm].options : []).find(x => x.value === v);
    if (o) classes.push({ cls: o.cls, label: o.label, kind: dm, opt: o }); else flags.push({ dm, v, others: (LETTERS[dm][v] || []).filter(c => c !== code) });
  });
  return { d, classes, flags };
}
